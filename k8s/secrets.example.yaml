apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: ourlittletribe
type: Opaque
stringData:
  # Database Config
  POSTGRES_PASSWORD: "your_postgres_password_here"
  
  # Database Connection String for backend to use (Uses the k8s service name `postgres-service`)
  DATABASE_URL: "postgres://postgres:your_postgres_password_here@postgres-service:5432/ourlittletribe?sslmode=disable"
  
  # Google API Keys (Extracted from backend/secrets)
  GOOGLE_CLIENT_ID: "your_google_client_id_here"
  GOOGLE_CLIENT_SECRET: "your_google_client_secret_here"
  # IMPORTANT: Since you don't have a domain, you MUST deploy once to get the LoadBalancer IP,
  # paste it here, apply the secret again, and restart the backend pod.
  GOOGLE_CALLBACK_URL: "https://<MAGIC_DOMAIN>/v1/auth/google/callback"
  
  # Auth
  JWT_SECRET: "your_super_secret_jwt_key_here"
