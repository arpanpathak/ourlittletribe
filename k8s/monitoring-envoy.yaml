apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: envoy-gateway-metrics
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      gateway.envoyproxy.io/owning-gateway-name: outlittletribe-gateway
  namespaceSelector:
    matchNames:
      - envoy-gateway-system
  podMetricsEndpoints:
  - port: metrics
    path: /stats/prometheus
    interval: 15s
