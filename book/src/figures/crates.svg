<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" role="img" aria-label="The six crates. tribe-server depends on all the others; tribe-db, tribe-places and tribe-brain use tribe-core's shared types; tribe-media stands alone." font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><defs>
<marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b625e"/></marker>
<marker id="tail" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#5b625e"/></marker>
</defs><rect width="860" height="330" fill="#ffffff"/><line x1="336.5" y1="93.0" x2="203.0" y2="147.2" stroke="#5b625e" stroke-width="1.5" marker-end="url(#head)"/><line x1="397.8" y1="93.0" x2="352.2" y2="147.0" stroke="#5b625e" stroke-width="1.5" marker-end="url(#head)"/><line x1="459.2" y1="93.0" x2="500.8" y2="147.0" stroke="#5b625e" stroke-width="1.5" marker-end="url(#head)"/><line x1="522.1" y1="93.0" x2="652.9" y2="147.0" stroke="#5b625e" stroke-width="1.5" marker-end="url(#head)"/><line x1="203.0" y1="215.1" x2="332.4" y2="257.0" stroke="#5b625e" stroke-width="1.5" marker-end="url(#head)"/><line x1="359.1" y1="223.0" x2="394.1" y2="257.0" stroke="#5b625e" stroke-width="1.5" marker-end="url(#head)"/><line x1="490.9" y1="223.0" x2="455.9" y2="257.0" stroke="#5b625e" stroke-width="1.5" marker-end="url(#head)"/><rect x="320" y="20" width="220" height="70" rx="10" fill="#e5f2eb" stroke="#1f6f4e" stroke-width="1.6"/><text x="430" y="44" text-anchor="middle" font-size="14" font-weight="700" fill="#10362a">tribe-server</text><text x="430" y="62" text-anchor="middle" font-size="12" fill="#10362a" opacity=".85">routes, sessions, caches,</text><text x="430" y="78" text-anchor="middle" font-size="12" fill="#10362a" opacity=".85">search and trip planning</text><rect x="20" y="150" width="180" height="70" rx="10" fill="#e5f2eb" stroke="#1f6f4e" stroke-width="1.6"/><text x="110" y="174" text-anchor="middle" font-size="14" font-weight="700" fill="#10362a">tribe-db</text><text x="110" y="192" text-anchor="middle" font-size="12" fill="#10362a" opacity=".85">tables and queries</text><text x="110" y="208" text-anchor="middle" font-size="12" fill="#10362a" opacity=".85">rusqlite</text><rect x="230" y="150" width="180" height="70" rx="10" fill="#e5f2eb" stroke="#1f6f4e" stroke-width="1.6"/><text x="320" y="174" text-anchor="middle" font-size="14" font-weight="700" fill="#10362a">tribe-places</text><text x="320" y="192" text-anchor="middle" font-size="12" fill="#10362a" opacity=".85">Photon, Nominatim, OSRM,</text><text x="320" y="208" text-anchor="middle" font-size="12" fill="#10362a" opacity=".85">Overpass, Open-Meteo</text><rect x="440" y="150" width="180" height="70" rx="10" fill="#efe9f8" stroke="#6b4fa0" stroke-width="1.6"/><text x="530" y="174" text-anchor="middle" font-size="14" font-weight="700" fill="#36255a">tribe-brain</text><text x="530" y="192" text-anchor="middle" font-size="12" fill="#36255a" opacity=".85">prompts, schemas,</text><text x="530" y="208" text-anchor="middle" font-size="12" fill="#36255a" opacity=".85">checking answers</text><rect x="650" y="150" width="190" height="70" rx="10" fill="#e5f2eb" stroke="#1f6f4e" stroke-width="1.6"/><text x="745" y="174" text-anchor="middle" font-size="14" font-weight="700" fill="#10362a">tribe-media</text><text x="745" y="192" text-anchor="middle" font-size="12" fill="#10362a" opacity=".85">decode, resize,</text><text x="745" y="208" text-anchor="middle" font-size="12" fill="#10362a" opacity=".85">re-encode pictures</text><rect x="230" y="260" width="390" height="54" rx="10" fill="#e5f2eb" stroke="#1f6f4e" stroke-width="1.6"/><text x="425" y="284" text-anchor="middle" font-size="14" font-weight="700" fill="#10362a">tribe-core</text><text x="425" y="302" text-anchor="middle" font-size="12" fill="#10362a" opacity=".85">geometry, clock, basket statistics, store ranking: no I/O</text></svg>