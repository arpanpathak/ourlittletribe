<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-label="Every job the model does follows one path: facts written as plain lines, one request with a JSON schema, then the answer is checked and trimmed in Rust before anything is saved or shown." font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><defs>
