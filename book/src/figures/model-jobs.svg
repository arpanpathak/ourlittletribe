ll="#e5f2eb" stroke="#1f6f4e" stroke-width="1.6"/><text x="605" y="191" text-anchor="middle" font-size="14" font-weight="700" fill="#10362a">Check in Rust</text><text x="605" y="209" text-anchor="middle" font-size="12" fill="#10362a" opacity=".85">enums, lengths, dates,</text><text x="605" y="225" text-anchor="middle" font-size="12" fill="#10362a" opacity=".85">tags, limits</text><text x="605" y="241" text-anchor="middle" font-size="12" fill="#10362a" opacity=".85">drop what fails</text><rect x="760" y="20" width="180" height="54" rx="10" fill="#e5f2eb" stroke="#1f6f4e" stroke-width="1.6"/><text x="850" y="44" text-anchor="middle" font-size="14" font-weight="700" fill="#10362a">Packing list</text><text x="850" y="62" text-anchor="middle" font-size="12" fill="#10362a" opacity=".85">plan_items</text><rect x="760" y="95" width="180" height="54" rx="10" fill="#e5f2eb" stroke="#1f6f4e" stroke-width="1.6"/><text x="850" y="119" text-anchor="middle" font-size="14" font-weight="700" fill="#10362a">Conditions briefing</text><text x="850" y="137" text-anchor="middle" font-size="12" fill="#10362a" opacity=".85">write_briefing</text><rect x="760" y="170" width="180" height="54" rx="10" fill="#e5f2eb" stroke="#1f6f4e" stroke-width="1.6"/><text x="850" y="194" text-anchor="middle" font-size="14" font-weight="700" fill="#10362a">Form from words</text><text x="850" y="212" text-anchor="middle" font-size="12" fill="#10362a" opacity=".85">draft_event</text><rect x="760" y="245" width="180" height="54" rx="10" fill="#e5f2eb" stroke="#1f6f4e" stroke-width="1.6"/><text x="850" y="269" text-anchor="middle" font-size="14" font-weight="700" fill="#10362a">Description writer</text><text x="850" y="287" text-anchor="middle" font-size="12" fill="#10362a" opacity=".85">write_description</text><rect x="760" y="320" width="180" height="70" rx="10" fill="#e5f2eb" stroke="#1f6f4e" stroke-width="1.6"/><text x="850" y="344" text-anchor="middle" font-size="14" font-weight="700" fill="#10362a">Place search</text><text x="850" y="362" text-anchor="middle" font-size="12" fill="#10362a" opacity=".85">interpret_place_search</text><text x="850" y="378" text-anchor="middle" font-size="12" fill="#10362a" opacity=".85">choose_places</text></svg>