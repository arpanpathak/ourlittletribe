</g><path d="M305 154 L455 154" fill="none" stroke="#c8571f" stroke-width="1.8"/><path d="M447.8 157.5 L455 154 L447.8 150.5 Z" fill="#c8571f"/><path d="M455 194 L305 194" fill="none" stroke="#2f7d5b" stroke-width="1.8"/><path d="M312.2 190.5 L305 194 L312.2 197.5 Z" fill="#2f7d5b"/><path d="M745 168.5 L838 168.5" fill="none" stroke="#a8741a" stroke-width="1.8"/><path d="M830.8 172.0 L838 168.5 L830.8 165.0 Z" fill="#a8741a"/><text x="380" y="144" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#5d6a63" text-anchor="middle">POST /api/sessions</text><text x="380" y="216" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#5d6a63" text-anchor="middle">Set-Cookie</text><text x="560" y="263" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#5d6a63" text-anchor="middle" font-style="italic">A stolen copy of the database holds hashes only: none of them signs anyone in.</text>
</svg>