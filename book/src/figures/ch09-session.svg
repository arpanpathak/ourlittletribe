<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 297" width="1120" height="297" role="img">
<rect x="0.5" y="0.5" width="1119" height="296" rx="18" fill="#faf7f0" stroke="#ddd6c6"/>
<text x="32" y="46" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="700" fill="#1d2722" text-anchor="start">Signing in</text>
<text x="32" y="70" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5d6a63" text-anchor="start">The token lives in the browser; the server keeps only its hash.</text>
<g>
<rect x="45" y="120" width="260" height="97" rx="12" fill="#ffffff" stroke="#ddd6c6"/>
<rect x="45" y="130" width="4" height="77" rx="2" fill="#c8571f"/>
