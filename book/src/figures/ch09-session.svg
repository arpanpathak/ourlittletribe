</g><g>
<rect x="455" y="120" width="290" height="97" rx="12" fill="#ffffff" stroke="#ddd6c6"/>
<rect x="455" y="130" width="4" height="77" rx="2" fill="#2f7d5b"/>
<rect x="471" y="152.5" width="32" height="32" rx="8" fill="#e2f0e8"/><g transform="translate(477 158.5) scale(0.8333333333333334)" fill="none" stroke="#2f7d5b" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m3 19 6.5-11 3.5 6 2.5-3.5L21 19z"/><circle cx="17" cy="6" r="1.6"/></g><text x="515" y="147" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="650" fill="#1d2722" text-anchor="start">Server</text><text x="515" y="166" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5d6a63" text-anchor="start">password checked with Argon2id</text><text x="515" y="183" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5d6a63" text-anchor="start">new token: 256 random bits</text><text x="515" y="200" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5d6a63" text-anchor="start">keeps no copy of it</text>
</g><g>
