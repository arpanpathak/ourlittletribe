<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img">
<rect x="0.5" y="0.5" width="999" height="319" rx="18" fill="#faf7f0" stroke="#ddd6c6"/>
<text x="32" y="46" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="700" fill="#1d2722" text-anchor="start">An event can go to more than one place</text>
<text x="32" y="70" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5d6a63" text-anchor="start">The editor keeps this order: the meeting point first, the stops as planned, the venue last.</text>
<path d="M172 170 H361.33333333333337" stroke="#8b958f" stroke-width="2.5" stroke-dasharray="8 6"/><path d="M405.33333333333337 170 H594.6666666666667" stroke="#8b958f" stroke-width="2.5" stroke-dasharray="3 6"/><path d="M638.6666666666667 170 H828" stroke="#8b958f" stroke-width="2.5" stroke-dasharray="3 6"/><circle cx="150" cy="170" r="20" fill="#2f7d5b"/><text x="150" y="176" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="750" fill="#ffffff" text-anchor="middle">M</text><text x="150" y="220" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="650" fill="#1d2722" text-anchor="middle">Issaquah park-and-ride</text><text x="150" y="238" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5d6a63" text-anchor="middle">meeting point</text><circle cx="383.33333333333337" cy="170" r="20" fill="#2d6a9f"/><text x="383.33333333333337" y="176" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="750" fill="#ffffff" text-anchor="middle">1</text><text x="383.33333333333337" y="220" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="650" fill="#1d2722" text-anchor="middle">Coffee in Snoqualmie</text><text x="383.33333333333337" y="238" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5d6a63" text-anchor="middle">stop on the way</text><circle cx="616.6666666666667" cy="170" r="20" fill="#4f5d68"/><text x="616.6666666666667" y="176" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="750" fill="#ffffff" text-anchor="middle">2</text><text x="616.6666666666667" y="220" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="650" fill="#1d2722" text-anchor="middle">Snoqualmie Falls</text><text x="616.6666666666667" y="238" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5d6a63" text-anchor="middle">optional stop</text><circle cx="850" cy="170" r="20" fill="#c8571f"/><text x="850" y="176" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="750" fill="#ffffff" text-anchor="middle">V</text><text x="850" y="220" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="650" fill="#1d2722" text-anchor="middle">Rattlesnake Ledge trailhead</text><text x="850" y="238" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5d6a63" text-anchor="middle">event venue</text><text x="500" y="290" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5d6a63" text-anchor="middle" font-style="italic">Trip directions pass through M, every stop that is not optional, and V. The forecast is taken at V.</text>
</svg>