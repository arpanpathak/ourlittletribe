<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 400" width="1080" height="400" role="img">
<rect x="0.5" y="0.5" width="1079" height="399" rx="18" fill="#faf7f0" stroke="#ddd6c6"/>
<text x="32" y="46" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="700" fill="#1d2722" text-anchor="start">An event can go to many places</text>
<text x="32" y="70" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5d6a63" text-anchor="start">The meeting point first, then other meeting points, stops on the way, the venue, and where the group goes after.</text>
