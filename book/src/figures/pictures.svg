<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" width="960" height="250" role="img" aria-label="A picture's path: the upload is checked and limited, decoded off the async threads two at a time, turned upright, resized to 1600 and 560 pixels, re-encoded as JPEG without metadata, written to disk, and recorded in the database." font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><defs>
<marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b625e"/></marker>
<marker id="tail" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#5b625e"/></marker>
</defs><rect width="960" height="250" fill="#ffffff"/><line x1="163.0" y1="125.0" x2="197.0" y2="125.0" stroke="#5b625e" stroke-width="1.5" marker-end="url(#head)"/><line x1="363.0" y1="125.0" x2="397.0" y2="125.0" stroke="#5b625e" stroke-width="1.5" marker-end="url(#head)"/><line x1="553.0" y1="125.0" x2="587.0" y2="125.0" stroke="#5b625e" stroke-width="1.5" marker-end="url(#head)"/><line x1="743.0" y1="99.0" x2="777.0" y2="87.7" stroke="#5b625e" stroke-width="1.5" marker-end="url(#head)"/><line x1="743.0" y1="151.0" x2="777.0" y2="162.3" stroke="#5b625e" stroke-width="1.5" marker-end="url(#head)"/><rect x="20" y="90" width="140" height="70" rx="10" fill="#fdeee6" stroke="#c2410c" stroke-width="1.6"/><text x="90" y="114" text-anchor="middle" font-size="14" font-weight="700" fill="#6b2306">Upload</text><text x="90" y="132" text-anchor="middle" font-size="12" fill="#6b2306" opacity=".85">15 MB at most,</text><text x="90" y="148" text-anchor="middle" font-size="12" fill="#6b2306" opacity=".85">300 an hour</text><rect x="200" y="90" width="160" height="70" rx="10" fill="#e5f2eb" stroke="#1f6f4e" stroke-width="1.6"/><text x="280" y="114" text-anchor="middle" font-size="14" font-weight="700" fill="#10362a">Decode</text><text x="280" y="132" text-anchor="middle" font-size="12" fill="#10362a" opacity=".85">JPEG, PNG, WebP, GIF</text><text x="280" y="148" text-anchor="middle" font-size="12" fill="#10362a" opacity=".85">12,000 px at most</text><rect x="400" y="90" width="150" height="70" rx="10" fill="#e5f2eb" stroke="#1f6f4e" stroke-width="1.6"/><text x="475" y="114" text-anchor="middle" font-size="14" font-weight="700" fill="#10362a">Turn upright</text><text x="475" y="132" text-anchor="middle" font-size="12" fill="#10362a" opacity=".85">then forget</text><text x="475" y="148" text-anchor="middle" font-size="12" fill="#10362a" opacity=".85">EXIF and GPS</text><rect x="590" y="90" width="150" height="70" rx="10" fill="#e5f2eb" stroke="#1f6f4e" stroke-width="1.6"/><text x="665" y="114" text-anchor="middle" font-size="14" font-weight="700" fill="#10362a">Two sizes</text><text x="665" y="132" text-anchor="middle" font-size="12" fill="#10362a" opacity=".85">1600 px, 560 px</text><text x="665" y="148" text-anchor="middle" font-size="12" fill="#10362a" opacity=".85">JPEG quality 82</text><rect x="780" y="30" width="160" height="60" rx="10" fill="#f6efe3" stroke="#a8741a" stroke-width="1.6"/><text x="860" y="57" text-anchor="middle" font-size="14" font-weight="700" fill="#5a3d0a">{id}.jpg, {id}_s.jpg</text><text x="860" y="75" text-anchor="middle" font-size="12" fill="#5a3d0a" opacity=".85">pictures folder</text><rect x="780" y="160" width="160" height="60" rx="10" fill="#f6efe3" stroke="#a8741a" stroke-width="1.6"/><text x="860" y="187" text-anchor="middle" font-size="14" font-weight="700" fill="#5a3d0a">images row</text><text x="860" y="205" text-anchor="middle" font-size="12" fill="#5a3d0a" opacity=".85">what it belongs to</text></svg>