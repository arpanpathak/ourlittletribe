<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-label="The web app: no framework and no build step. theme.js runs before the page draws, app.js routes on the URL hash, views draw pages from small DOM helpers, components are reused across views, and everything is embedded in the server binary." font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><defs>
<marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b625e"/></marker>
<marker id="tail" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#5b625e"/></marker>
</defs><rect width="960" height="330" fill="#ffffff"/><line x1="330.0" y1="93.0" x2="330.0" y2="137.0" stroke="#5b625e" stroke-width="1.5" marker-end="url(#head)"/><line x1="433.0" y1="175.0" x2="477.0" y2="175.0" stroke="#5b625e" stroke-width="1.5" marker-end="url(#head)"/><line x1="415.9" y1="137.0" x2="515.4" y2="93.0" stroke="#5b625e" stroke-width="1.5" marker-end="url(#head)"/><line x1="703.0" y1="175.0" x2="737.0" y2="175.0" stroke="#5b625e" stroke-width="1.5" marker-end="url(#head)"/><line x1="330.0" y1="213.0" x2="330.0" y2="247.0" stroke="#5b625e" stroke-width="1.5" marker-end="url(#head)"/><rect x="20" y="30" width="170" height="60" rx="10" fill="#e5f2eb" stroke="#1f6f4e" stroke-width="1.6"/><text x="105" y="57" text-anchor="middle" font-size="14" font-weight="700" fill="#10362a">theme.js</text><text x="105" y="75" text-anchor="middle" font-size="12" fill="#10362a" opacity=".85">light, dark, auto</text><rect x="230" y="30" width="200" height="60" rx="10" fill="#e5f2eb" stroke="#1f6f4e" stroke-width="1.6"/><text x="330" y="57" text-anchor="middle" font-size="14" font-weight="700" fill="#10362a">app.js</text><text x="330" y="75" text-anchor="middle" font-size="12" fill="#10362a" opacity=".85">sidebar, routes, session</text><rect x="230" y="140" width="200" height="70" rx="10" fill="#e5f2eb" stroke="#1f6f4e" stroke-width="1.6"/><text x="330" y="164" text-anchor="middle" font-size="14" font-weight="700" fill="#10362a">views/</text><text x="330" y="182" text-anchor="middle" font-size="12" fill="#10362a" opacity=".85">feed, events, event,</text><text x="330" y="198" text-anchor="middle" font-size="12" fill="#10362a" opacity=".85">form, tribe, profile</text><rect x="480" y="140" width="220" height="70" rx="10" fill="#e5f2eb" stroke="#1f6f4e" stroke-width="1.6"/><text x="590" y="164" text-anchor="middle" font-size="14" font-weight="700" fill="#10362a">components/</text><text x="590" y="182" text-anchor="middle" font-size="12" fill="#10362a" opacity=".85">place search, locations,</text><text x="590" y="198" text-anchor="middle" font-size="12" fill="#10362a" opacity=".85">editor, conditions, voice</text><rect x="480" y="30" width="220" height="60" rx="10" fill="#e5f2eb" stroke="#1f6f4e" stroke-width="1.6"/><text x="590" y="57" text-anchor="middle" font-size="14" font-weight="700" fill="#10362a">ui.js, icons.js, art.js</text><text x="590" y="75" text-anchor="middle" font-size="12" fill="#10362a" opacity=".85">DOM helpers, icons, scenes</text><rect x="740" y="140" width="200" height="70" rx="10" fill="#e5f2eb" stroke="#1f6f4e" stroke-width="1.6"/><text x="840" y="164" text-anchor="middle" font-size="14" font-weight="700" fill="#10362a">markdown.js</text><text x="840" y="182" text-anchor="middle" font-size="12" fill="#10362a" opacity=".85">renders to DOM nodes,</text><text x="840" y="198" text-anchor="middle" font-size="12" fill="#10362a" opacity=".85">never innerHTML</text><rect x="230" y="250" width="200" height="54" rx="10" fill="#e8f0fa" stroke="#2563a8" stroke-width="1.6"/><text x="330" y="274" text-anchor="middle" font-size="14" font-weight="700" fill="#17375e">api.js</text><text x="330" y="292" text-anchor="middle" font-size="12" fill="#17375e" opacity=".85">fetch with cookies</text><rect x="740" y="250" width="200" height="54" rx="10" fill="#f6efe3" stroke="#a8741a" stroke-width="1.6"/><text x="840" y="274" text-anchor="middle" font-size="14" font-weight="700" fill="#5a3d0a">Embedded in the binary</text><text x="840" y="292" text-anchor="middle" font-size="12" fill="#5a3d0a" opacity=".85">include_bytes!</text></svg>