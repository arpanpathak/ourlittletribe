<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-label="Stores on the way: the person's starting point and the meeting point give an OSRM route; Overpass finds shops of the needed kinds within 1.5 km of it, falling back to shops seen before; each is ranked by the detour it adds and the items it covers." font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><defs>
<marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b625e"/></marker>
<marker id="tail" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#5b625e"/></marker>
</defs><rect width="960" height="300" fill="#ffffff"/><line x1="183.0" y1="70.0" x2="227.0" y2="70.0" stroke="#5b625e" stroke-width="1.5" marker-end="url(#head)"/><line x1="403.0" y1="71.9" x2="447.0" y2="72.9" stroke="#5b625e" stroke-width="1.5" marker-end="url(#head)"/><line x1="643.0" y1="102.2" x2="687.0" y2="114.4" stroke="#5b625e" stroke-width="1.5" marker-end="url(#head)"/><line x1="643.0" y1="191.4" x2="687.0" y2="180.8" stroke="#5b625e" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#head)"/><line x1="183.0" y1="207.5" x2="687.0" y2="161.6" stroke="#5b625e" stroke-width="1.5" marker-end="url(#head)"/><rect x="400.2" y="174.54545454545456" width="69.6" height="18" rx="9" fill="#ffffff" stroke="#d2d2cc"/><text x="435" y="188.04545454545456" text-anchor="middle" font-size="11" fill="#3a403c">shop tags</text><rect x="20" y="40" width="160" height="60" rx="10" fill="#fdeee6" stroke="#c2410c" stroke-width="1.6"/><text x="100" y="67" text-anchor="middle" font-size="14" font-weight="700" fill="#6b2306">Your start</text><text x="100" y="85" text-anchor="middle" font-size="12" fill="#6b2306" opacity=".85">shared by choice</text><rect x="20" y="180" width="160" height="70" rx="10" fill="#e5f2eb" stroke="#1f6f4e" stroke-width="1.6"/><text x="100" y="204" text-anchor="middle" font-size="14" font-weight="700" fill="#10362a">Still needed</text><text x="100" y="222" text-anchor="middle" font-size="12" fill="#10362a" opacity=".85">your items and</text><text x="100" y="238" text-anchor="middle" font-size="12" fill="#10362a" opacity=".85">shared ones nobody has</text><rect x="230" y="40" width="170" height="60" rx="10" fill="#e8f0fa" stroke="#2563a8" stroke-width="1.6"/><text x="315" y="67" text-anchor="middle" font-size="14" font-weight="700" fill="#17375e">OSRM route</text><text x="315" y="85" text-anchor="middle" font-size="12" fill="#17375e" opacity=".85">to the meeting point</text><rect x="450" y="40" width="190" height="70" rx="10" fill="#e8f0fa" stroke="#2563a8" stroke-width="1.6"/><text x="545" y="64" text-anchor="middle" font-size="14" font-weight="700" fill="#17375e">Overpass</text><text x="545" y="82" text-anchor="middle" font-size="12" fill="#17375e" opacity=".85">shops within 1.5 km</text><text x="545" y="98" text-anchor="middle" font-size="12" fill="#17375e" opacity=".85">of the route</text><rect x="450" y="180" width="190" height="70" rx="10" fill="#f6efe3" stroke="#a8741a" stroke-width="1.6"/><text x="545" y="204" text-anchor="middle" font-size="14" font-weight="700" fill="#5a3d0a">stores table</text><text x="545" y="222" text-anchor="middle" font-size="12" fill="#5a3d0a" opacity=".85">shops seen before,</text><text x="545" y="238" text-anchor="middle" font-size="12" fill="#5a3d0a" opacity=".85">when Overpass is busy</text><rect x="690" y="110" width="250" height="80" rx="10" fill="#e5f2eb" stroke="#1f6f4e" stroke-width="1.6"/><text x="815" y="131" text-anchor="middle" font-size="14" font-weight="700" fill="#10362a">Rank</text><text x="815" y="149" text-anchor="middle" font-size="12" fill="#10362a" opacity=".85">detour minutes (OSRM),</text><text x="815" y="165" text-anchor="middle" font-size="12" fill="#10362a" opacity=".85">items covered, at most</text><text x="815" y="181" text-anchor="middle" font-size="12" fill="#10362a" opacity=".85">three per kind of shop</text></svg>