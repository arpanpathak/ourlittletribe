<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-label="How the Conditions card is built: the venue is found, its hourly forecast and elevation fetched and cached for 30 minutes, the facts written out, and the model's briefing checked and cached for an hour per event and unit system." font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><defs>
<marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b625e"/></marker>
<marker id="tail" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#5b625e"/></marker>
</defs><rect width="960" height="300" fill="#ffffff"/><line x1="173.0" y1="119.0" x2="207.0" y2="107.7" stroke="#5b625e" stroke-width="1.5" marker-end="url(#head)"/><line x1="173.0" y1="169.1" x2="207.0" y2="179.7" stroke="#5b625e" stroke-width="1.5" marker-end="url(#head)"/><line x1="403.0" y1="104.8" x2="447.0" y2="118.2" stroke="#5b625e" stroke-width="1.5" marker-end="url(#head)"/><line x1="403.0" y1="182.3" x2="447.0" y2="169.9" stroke="#5b625e" stroke-width="1.5" marker-end="url(#head)"/><line x1="623.0" y1="112.6" x2="657.0" y2="100.1" stroke="#5b625e" stroke-width="1.5" marker-end="url(#head)"/><line x1="793.0" y1="106.2" x2="807.0" y2="112.6" stroke="#5b625e" stroke-width="1.5" marker-end="url(#head)"/><rect x="762" y="99.42622950819671" width="76" height="18" rx="9" fill="#ffffff" stroke="#d2d2cc"/><text x="800" y="112.92622950819671" text-anchor="middle" font-size="11" fill="#3a403c">cached 1 h</text><line x1="623.0" y1="145.0" x2="807.0" y2="145.0" stroke="#5b625e" stroke-width="1.5" marker-end="url(#head)"/><rect x="661" y="135" width="108" height="18" rx="9" fill="#ffffff" stroke="#d2d2cc"/><text x="715" y="148.5" text-anchor="middle" font-size="11" fill="#3a403c">hours, daylight</text><rect x="20" y="110" width="150" height="70" rx="10" fill="#e5f2eb" stroke="#1f6f4e" stroke-width="1.6"/><text x="95" y="134" text-anchor="middle" font-size="14" font-weight="700" fill="#10362a">Event</text><text x="95" y="152" text-anchor="middle" font-size="12" fill="#10362a" opacity=".85">venue, else the</text><text x="95" y="168" text-anchor="middle" font-size="12" fill="#10362a" opacity=".85">meeting point</text><rect x="210" y="40" width="190" height="70" rx="10" fill="#e8f0fa" stroke="#2563a8" stroke-width="1.6"/><text x="305" y="64" text-anchor="middle" font-size="14" font-weight="700" fill="#17375e">Open-Meteo</text><text x="305" y="82" text-anchor="middle" font-size="12" fill="#17375e" opacity=".85">hourly: temperature, rain,</text><text x="305" y="98" text-anchor="middle" font-size="12" fill="#17375e" opacity=".85">wind, freezing level</text><rect x="210" y="180" width="190" height="60" rx="10" fill="#e8f0fa" stroke="#2563a8" stroke-width="1.6"/><text x="305" y="207" text-anchor="middle" font-size="14" font-weight="700" fill="#17375e">Elevation</text><text x="305" y="225" text-anchor="middle" font-size="12" fill="#17375e" opacity=".85">at the venue</text><rect x="450" y="110" width="170" height="70" rx="10" fill="#e5f2eb" stroke="#1f6f4e" stroke-width="1.6"/><text x="535" y="134" text-anchor="middle" font-size="14" font-weight="700" fill="#10362a">Trip facts</text><text x="535" y="152" text-anchor="middle" font-size="12" fill="#10362a" opacity=".85">itinerary, start,</text><text x="535" y="168" text-anchor="middle" font-size="12" fill="#10362a" opacity=".85">hour by hour</text><rect x="660" y="40" width="130" height="70" rx="10" fill="#efe9f8" stroke="#6b4fa0" stroke-width="1.6"/><text x="725" y="72" text-anchor="middle" font-size="14" font-weight="700" fill="#36255a">Model</text><text x="725" y="90" text-anchor="middle" font-size="12" fill="#36255a" opacity=".85">verdict, points</text><rect x="810" y="110" width="135" height="70" rx="10" fill="#fdeee6" stroke="#c2410c" stroke-width="1.6"/><text x="877.5" y="134" text-anchor="middle" font-size="14" font-weight="700" fill="#6b2306">The card</text><text x="877.5" y="152" text-anchor="middle" font-size="12" fill="#6b2306" opacity=".85">briefing, hours,</text><text x="877.5" y="168" text-anchor="middle" font-size="12" fill="#6b2306" opacity=".85">°F and °C</text></svg>