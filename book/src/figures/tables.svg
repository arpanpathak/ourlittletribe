<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-label="The tables and how they refer to each other: people belong to tribes, tribes hold events, events have stops, RSVPs, list items with marks, pictures and starting points." font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><defs>
