n, shop tags</text><rect x="760" y="320" width="180" height="54" rx="10" fill="#f6efe3" stroke="#a8741a" stroke-width="1.6"/><text x="850" y="344" text-anchor="middle" font-size="14" font-weight="700" fill="#5a3d0a">item_marks</text><text x="850" y="362" text-anchor="middle" font-size="12" fill="#5a3d0a" opacity=".85">bringing, got</text><rect x="520" y="320" width="190" height="64" rx="10" fill="#f6efe3" stroke="#a8741a" stroke-width="1.6"/><text x="615" y="349" text-anchor="middle" font-size="14" font-weight="700" fill="#5a3d0a">images</text><text x="615" y="367" text-anchor="middle" font-size="12" fill="#5a3d0a" opacity=".85">covers and event photos</text><rect x="270" y="200" width="190" height="60" rx="10" fill="#f6efe3" stroke="#a8741a" stroke-width="1.6"/><text x="365" y="227" text-anchor="middle" font-size="14" font-weight="700" fill="#5a3d0a">trip_origins</text><text x="365" y="245" text-anchor="middle" font-size="12" fill="#5a3d0a" opacity=".85">deleted a day after</text><rect x="270" y="320" width="190" height="64" rx="10" fill="#f6efe3" stroke="#a8741a" stroke-width="1.6"/><text x="365" y="349" text-anchor="middle" font-size="14" font-weight="700" fill="#5a3d0a">stores</text><text x="365" y="367" text-anchor="middle" font-size="12" fill="#5a3d0a" opacity=".85">cache of OSM shops</text><rect x="20" y="270" width="190" height="54" rx="10" fill="#f6efe3" stroke="#a8741a" stroke-width="1.6"/><text x="115" y="294" text-anchor="middle" font-size="14" font-weight="700" fill="#5a3d0a">activity_log</text><text x="115" y="312" text-anchor="middle" font-size="12" fill="#5a3d0a" opacity=".85">the feed</text><rect x="20" y="380" width="190" height="54" rx="10" fill="#f6efe3" stroke="#a8741a" stroke-width="1.6"/><text x="115" y="404" text-anchor="middle" font-size="14" font-weight="700" fill="#5a3d0a">inline_images</text><text x="115" y="422" text-anchor="middle" font-size="12" fill="#5a3d0a" opacity=".85">pictures in descriptions</text><text x="270" y="450" font-size="12" fill="#5b625e" >stores has no links: it is a cache any route can reuse.</text></svg>