<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 316" width="1100" height="316" role="img">
<rect x="0.5" y="0.5" width="1099" height="315" rx="18" fill="#faf7f0" stroke="#ddd6c6"/>
<text x="32" y="46" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="700" fill="#1d2722" text-anchor="start">Every picture is decoded and written again</text>
<text x="32" y="70" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5d6a63" text-anchor="start">tribe-media::process: the server only ever serves files it wrote itself, in one format.</text>
<path d="M221 156 L243 156" fill="none" stroke="#4f5d68" stroke-width="1.8"/><path d="M235.8 159.5 L243 156 L235.8 152.5 Z" fill="#4f5d68"/><path d="M433 156 L455 156" fill="none" stroke="#4f5d68" stroke-width="1.8"/><path d="M447.8 159.5 L455 156 L447.8 152.5 Z" fill="#4f5d68"/><path d="M645 156 L667 156" fill="none" stroke="#4f5d68" stroke-width="1.8"/><path d="M659.8 159.5 L667 156 L659.8 152.5 Z" fill="#4f5d68"/><path d="M857 156 L879 156" fill="none" stroke="#4f5d68" stroke-width="1.8"/><path d="M871.8 159.5 L879 156 L871.8 152.5 Z" fill="#4f5d68"/><g>
<rect x="31" y="116" width="190" height="80" rx="12" fill="#ffffff" stroke="#ddd6c6"/>
<rect x="31" y="126" width="4" height="60" rx="2" fill="#4f5d68"/>
<text x="51" y="143" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="650" fill="#1d2722" text-anchor="start">Check, decode</text><text x="51" y="162" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5d6a63" text-anchor="start">JPEG, PNG, WebP, GIF</text><text x="51" y="179" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5d6a63" text-anchor="start">≤ 12,000 px a side</text>
</g><g>
<rect x="243" y="116" width="190" height="80" rx="12" fill="#ffffff" stroke="#ddd6c6"/>
<rect x="243" y="126" width="4" height="60" rx="2" fill="#4f5d68"/>
<text x="263" y="143" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="650" fill="#1d2722" text-anchor="start">Turn upright</text><text x="263" y="162" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5d6a63" text-anchor="start">from the EXIF</text><text x="263" y="179" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5d6a63" text-anchor="start">orientation</text>
</g><g>
<rect x="455" y="116" width="190" height="80" rx="12" fill="#ffffff" stroke="#ddd6c6"/>
<rect x="455" y="126" width="4" height="60" rx="2" fill="#4f5d68"/>
<text x="475" y="143" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="650" fill="#1d2722" text-anchor="start">Flatten</text><text x="475" y="162" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5d6a63" text-anchor="start">transparency</text><text x="475" y="179" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5d6a63" text-anchor="start">onto white</text>
</g><g>
<rect x="667" y="116" width="190" height="80" rx="12" fill="#ffffff" stroke="#ddd6c6"/>
<rect x="667" y="126" width="4" height="60" rx="2" fill="#2f7d5b"/>
<text x="687" y="143" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="650" fill="#1d2722" text-anchor="start">Two sizes</text><text x="687" y="162" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5d6a63" text-anchor="start">1,600 px and 560 px</text><text x="687" y="179" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5d6a63" text-anchor="start">on the long side</text>
</g><g>
<rect x="879" y="116" width="190" height="80" rx="12" fill="#ffffff" stroke="#ddd6c6"/>
<rect x="879" y="126" width="4" height="60" rx="2" fill="#2f7d5b"/>
<text x="899" y="143" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="650" fill="#1d2722" text-anchor="start">Write JPEG</text><text x="899" y="162" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5d6a63" text-anchor="start">quality 82, with</text><text x="899" y="179" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5d6a63" text-anchor="start">no metadata at all</text>
</g><rect x="32" y="227" width="143" height="22" rx="11" fill="#fbe7dc"/><text x="103.5" y="242" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#6b2a0b" text-anchor="middle">≤ 15 MB an upload</text><rect x="206" y="227" width="172" height="22" rx="11" fill="#fbe7dc"/><text x="292" y="242" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#6b2a0b" text-anchor="middle">≤ 300 uploads an hour</text><rect x="406" y="227" width="388" height="22" rx="11" fill="#ece6f6"/><text x="600" y="242" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#36255a" text-anchor="middle">two at a time, off the threads that answer requests</text><text x="32" y="284" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#5d6a63" text-anchor="start" font-style="italic">A phone photo's EXIF often holds the GPS position where it was taken. Writing new files from the pixels keeps none of it.</text>
</svg>