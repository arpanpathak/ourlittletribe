<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" role="img">
<rect x="0.5" y="0.5" width="999" height="429" rx="18" fill="#faf7f0" stroke="#ddd6c6"/>
<text x="32" y="46" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="700" fill="#1d2722" text-anchor="start">"Groups often also got" comes from counting</text>
<text x="32" y="70" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5d6a63" text-anchor="start">A worked example with made-up numbers: is a basket with microspikes likelier to hold hand warmers?</text>
<text x="60" y="135" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#1d2722" text-anchor="start">baskets (finished lists)</text><rect x="250" y="120" width="520" height="22" rx="6" fill="#e7ebee"/><rect x="250" y="120" width="520" height="22" rx="6" fill="#4f5d68"/><text x="784" y="136" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="650" fill="#1d2722" text-anchor="start">20</text><text x="60" y="179" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#1d2722" text-anchor="start">with microspikes</text><rect x="250" y="164" width="520" height="22" rx="6" fill="#e2edf8"/><rect x="250" y="164" width="208" height="22" rx="6" fill="#2d6a9f"/><text x="784" y="180" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="650" fill="#1d2722" text-anchor="start">8</text><text x="60" y="223" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#1d2722" text-anchor="start">with hand warmers</text><rect x="250" y="208" width="520" height="22" rx="6" fill="#fbe7dc"/><rect x="250" y="208" width="156" height="22" rx="6" fill="#c8571f"/><text x="784" y="224" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="650" fill="#1d2722" text-anchor="start">6</text><text x="60" y="267" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#1d2722" text-anchor="start">with both</text><rect x="250" y="252" width="520" height="22" rx="6" fill="#e2f0e8"/><rect x="250" y="252" width="130" height="22" rx="6" fill="#2f7d5b"/><text x="784" y="268" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="650" fill="#1d2722" text-anchor="start">5</text><g>
<rect x="47" y="310" width="290" height="63" rx="12" fill="#ffffff" stroke="#ddd6c6"/>
<rect x="47" y="320" width="4" height="43" rx="2" fill="#2f7d5b"/>
<text x="67" y="337" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="650" fill="#1d2722" text-anchor="start">support = 5 / 20 = 0.25</text><text x="67" y="356" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5d6a63" text-anchor="start">share of baskets with both</text>
</g><g>
<rect x="355" y="310" width="290" height="80" rx="12" fill="#ffffff" stroke="#ddd6c6"/>
<rect x="355" y="320" width="4" height="60" rx="2" fill="#2d6a9f"/>
<text x="375" y="337" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="650" fill="#1d2722" text-anchor="start">confidence = 5 / 8 = 0.63</text><text x="375" y="356" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5d6a63" text-anchor="start">of baskets with microspikes,</text><text x="375" y="373" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5d6a63" text-anchor="start">the share that also have warmers</text>
</g><g>
<rect x="663" y="310" width="290" height="80" rx="12" fill="#ffffff" stroke="#ddd6c6"/>
<rect x="663" y="320" width="4" height="60" rx="2" fill="#c8571f"/>
<text x="683" y="337" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="650" fill="#1d2722" text-anchor="start">lift = 0.63 / 0.30 = 2.08</text><text x="683" y="356" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5d6a63" text-anchor="start">above 1: together more often</text><text x="683" y="373" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5d6a63" text-anchor="start">than chance (needs ≥ 1.1)</text>
</g>
</svg>