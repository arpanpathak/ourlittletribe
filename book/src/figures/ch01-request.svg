<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 555" width="1000" height="555" role="img">
<rect x="0.5" y="0.5" width="999" height="554" rx="18" fill="#faf7f0" stroke="#ddd6c6"/>
<text x="32" y="46" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="700" fill="#1d2722" text-anchor="start">Opening an event takes two requests</text>
<text x="32" y="70" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5d6a63" text-anchor="start">The details answer at once; the model's briefing follows a few seconds later.</text>
<path d="M60 132 V525" stroke="#ddd6c6" stroke-width="1.5" stroke-dasharray="4 5"/><rect x="22.5" y="103" width="75" height="22" rx="11" fill="#fbe7dc"/><text x="60" y="118" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#6b2a0b" text-anchor="middle">Browser</text><path d="M280 132 V525" stroke="#ddd6c6" stroke-width="1.5" stroke-dasharray="4 5"/><rect x="246.5" y="103" width="67" height="22" rx="11" fill="#e2f0e8"/><text x="280" y="118" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#174a34" text-anchor="middle">Server</text><path d="M500 132 V525" stroke="#ddd6c6" stroke-width="1.5" stroke-dasharray="4 5"/><rect x="466.5" y="103" width="67" height="22" rx="11" fill="#f6ecd6"/><text x="500" y="118" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#55390a" text-anchor="middle">SQLite</text><path d="M720 132 V525" stroke="#ddd6c6" stroke-width="1.5" stroke-dasharray="4 5"/><rect x="671" y="103" width="98" height="22" rx="11" fill="#e2edf8"/><text x="720" y="118" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#173a5c" text-anchor="middle">Open-Meteo</text><path d="M940 132 V525" stroke="#ddd6c6" stroke-width="1.5" stroke-dasharray="4 5"/><rect x="910.5" y="103" width="59" height="22" rx="11" fill="#ece6f6"/><text x="940" y="118" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#36255a" text-anchor="middle">Model</text><rect x="40" y="340" width="920" height="34" rx="8" fill="#e7ebee" fill-opacity=".6"/><text x="500" y="362" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5d6a63" text-anchor="middle" font-style="italic">the page is already on screen while the model writes</text><path d="M60 170 L278 170" fill="none" stroke="#2f7d5b" stroke-width="1.8"/><path d="M270.8 173.5 L278 170 L270.8 166.5 Z" fill="#2f7d5b"/><text x="70" y="162" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1d2722" text-anchor="start">1  GET /api/events/{id}</text><path d="M280 220 L498 220" fill="none" stroke="#a8741a" stroke-width="1.8"/><path d="M490.8 223.5 L498 220 L490.8 216.5 Z" fill="#a8741a"/><text x="290" y="212" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1d2722" text-anchor="start">2  everything in one call</text><path d="M280 270 L718 270" fill="none" stroke="#2d6a9f" stroke-width="1.8"/><path d="M710.8 273.5 L718 270 L710.8 266.5 Z" fill="#2d6a9f"/><text x="290" y="262" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1d2722" text-anchor="start">3  forecast at the venue (cached 30 min)</text><path d="M280 320 L62 320" fill="none" stroke="#2f7d5b" stroke-width="1.8"/><path d="M69.2 316.5 L62 320 L69.2 323.5 Z" fill="#2f7d5b"/><text x="72" y="312" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1d2722" text-anchor="start">4  EventDetail: the page draws</text><path d="M60 400 L278 400" fill="none" stroke="#2f7d5b" stroke-width="1.8"/><path d="M270.8 403.5 L278 400 L270.8 396.5 Z" fill="#2f7d5b"/><text x="70" y="392" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1d2722" text-anchor="start">5  GET …/briefing?units=imperial</text><path d="M280 450 L938 450" fill="none" stroke="#6b4fa0" stroke-width="1.8"/><path d="M930.8 453.5 L938 450 L930.8 446.5 Z" fill="#6b4fa0"/><text x="290" y="442" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1d2722" text-anchor="start">6  write_briefing (4.5 s; cached 1 h)</text><path d="M280 500 L62 500" fill="none" stroke="#2f7d5b" stroke-width="1.8"/><path d="M69.2 496.5 L62 500 L69.2 503.5 Z" fill="#2f7d5b"/><text x="72" y="492" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1d2722" text-anchor="start">7  Briefing: the card fills in</text>
</svg>