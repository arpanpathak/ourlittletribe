<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-label="Place search in two lanes. The plain lane sends the text to Photon, or Nominatim when Photon fails, and answers at once. The smart lane asks the model what the words mean, looks each guess up inside its area's bounds, and lets the model choose among the real places found." font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><defs>
<marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b625e"/></marker>
<marker id="tail" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#5b625e"/></marker>
</defs><rect width="960" height="470" fill="#ffffff"/><rect x="160" y="20" width="780" height="120" rx="14" fill="#f7f7f5" stroke="#c9cec9" stroke-dasharray="4 4"/><text x="174" y="42" font-size="12.5" font-weight="700" fill="#5b625e" letter-spacing=".04em">PLAIN LANE: ABOUT A SECOND</text><rect x="160" y="160" width="780" height="290" rx="14" fill="#f7f7f5" stroke="#c9cec9" stroke-dasharray="4 4"/><text x="174" y="182" font-size="12.5" font-weight="700" fill="#5b625e" letter-spacing=".04em">SMART LANE: TWO TO TEN SECONDS</text><line x1="148.0" y1="182.3" x2="242.4" y2="123.0" stroke="#5b625e" stroke-width="1.5" marker-end="url(#head)"/><line x1="403.0" y1="90.0" x2="697.0" y2="90.0" stroke="#5b625e" stroke-width="1.5" marker-end="url(#head)"/><line x1="148.0" y1="232.9" x2="187.0" y2="237.4" stroke="#5b625e" stroke-width="1.5" marker-end="url(#head)"/><line x1="403.0" y1="240.1" x2="437.0" y2="236.9" stroke="#5b625e" stroke-width="1.5" marker-end="url(#head)"/><line x1="545.0" y1="257.0" x2="545.0" y2="287.0" stroke="#5b625e" stroke-width="1.5" marker-end="url(#head)"/><line x1="653.0" y1="302.2" x2="697.0" y2="292.8" stroke="#5b625e" stroke-width="1.5" marker-end="url(#head)"/><line x1="388.5" y1="123.0" x2="697.0" y2="231.9" stroke="#5b625e" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#head)"/><rect x="469.55" y="167.44117647058823" width="146.4" height="18" rx="9" fill="#ffffff" stroke="#d2d2cc"/><text x="542.75" y="180.94117647058823" text-anchor="middle" font-size="11" fill="#3a403c">plain results join in</text><line x1="805.0" y1="313.0" x2="805.0" y2="367.0" stroke="#5b625e" stroke-width="1.5" marker-end="url(#head)"/><rect x="15" y="185" width="130" height="80" rx="10" fill="#fdeee6" stroke="#c2410c" stroke-width="1.6"/><text x="80" y="214" text-anchor="middle" font-size="14" font-weight="700" fill="#6b2306">Typed text</text><text x="80" y="232" text-anchor="middle" font-size="12" fill="#6b2306" opacity=".85">mt rainier</text><text x="80" y="248" text-anchor="middle" font-size="12" fill="#6b2306" opacity=".85">henry jackson</text><rect x="190" y="60" width="210" height="60" rx="10" fill="#e8f0fa" stroke="#2563a8" stroke-width="1.6"/><text x="295" y="87" text-anchor="middle" font-size="14" font-weight="700" fill="#17375e">Photon</text><text x="295" y="105" text-anchor="middle" font-size="12" fill="#17375e" opacity=".85">Nominatim if Photon fails</text><rect x="700" y="60" width="210" height="60" rx="10" fill="#e5f2eb" stroke="#1f6f4e" stroke-width="1.6"/><text x="805" y="87" text-anchor="middle" font-size="14" font-weight="700" fill="#10362a">Other matches</text><text x="805" y="105" text-anchor="middle" font-size="12" fill="#10362a" opacity=".85">shown at once</text><rect x="190" y="210" width="210" height="80" rx="10" fill="#efe9f8" stroke="#6b4fa0" stroke-width="1.6"/><text x="295" y="239" text-anchor="middle" font-size="14" font-weight="700" fill="#36255a">Model: what is meant?</text><text x="295" y="257" text-anchor="middle" font-size="12" fill="#36255a" opacity=".85">Henry Jackson Trail,</text><text x="295" y="273" text-anchor="middle" font-size="12" fill="#36255a" opacity=".85">Mount Rainier National Park</text><rect x="440" y="200" width="210" height="54" rx="10" fill="#e8f0fa" stroke="#2563a8" stroke-width="1.6"/><text x="545" y="224" text-anchor="middle" font-size="14" font-weight="700" fill="#17375e">Find the area</text><text x="545" y="242" text-anchor="middle" font-size="12" fill="#17375e" opacity=".85">its bounds, or 0.2° around it</text><rect x="440" y="290" width="210" height="70" rx="10" fill="#e8f0fa" stroke="#2563a8" stroke-width="1.6"/><text x="545" y="314" text-anchor="middle" font-size="14" font-weight="700" fill="#17375e">Search inside the bounds</text><text x="545" y="332" text-anchor="middle" font-size="12" fill="#17375e" opacity=".85">full name, then each word</text><text x="545" y="348" text-anchor="middle" font-size="12" fill="#17375e" opacity=".85">jackson → Jackson Visitor Center</text><rect x="700" y="230" width="210" height="80" rx="10" fill="#efe9f8" stroke="#6b4fa0" stroke-width="1.6"/><text x="805" y="259" text-anchor="middle" font-size="14" font-weight="700" fill="#36255a">Model: which of these?</text><text x="805" y="277" text-anchor="middle" font-size="12" fill="#36255a" opacity=".85">real places only,</text><text x="805" y="293" text-anchor="middle" font-size="12" fill="#36255a" opacity=".85">near you unless named</text><rect x="700" y="370" width="210" height="60" rx="10" fill="#e5f2eb" stroke="#1f6f4e" stroke-width="1.6"/><text x="805" y="397" text-anchor="middle" font-size="14" font-weight="700" fill="#10362a">Best matches</text><text x="805" y="415" text-anchor="middle" font-size="12" fill="#10362a" opacity=".85">put on top of the list</text></svg>